# VendeFácil AI — Blueprint no estilo Invento (API + App Expo Web + Postgres)
# Dashboard: https://dashboard.render.com → New → Blueprint → este repositório
#
# URLs esperadas:
#   API:  https://vende-facil-api.onrender.com
#   App:  https://vende-facil-app.onrender.com
#
# Migração do serviço antigo `vende-facil-ai`:
# 1) No painel, Settings → renomeie para `vende-facil-api` (mantém ENCRYPTION_KEY e DB).
# 2) Aplique este Blueprint para criar `vende-facil-app`.
# 3) Em vende-facil-api, ajuste APP_URL e CORS_ORIGINS se ainda estiverem no valor antigo.
# NÃO apague o serviço sem copiar ENCRYPTION_KEY — senão sessões/dados cifrados quebram.
#
# Depois do primeiro deploy: defina GEMINI_API_KEY (e demais secrets) em
# vende-facil-api → Environment.

databases:
  - name: vende-facil-db
    plan: free
    databaseName: vendefacil
    user: vendefacil

services:
  - type: web
    name: vende-facil-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://vende-facil-api.onrender.com
      - key: CORS_ORIGINS
        value: "https://vende-facil-app.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: vende-facil-db
          property: connectionString
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: STORAGE_DRIVER
        value: local
      - key: TRUST_PROXY
        value: "true"
      - key: GEMINI_TEXT_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_VISION_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false

  - type: web
    name: vende-facil-app
    runtime: static
    rootDir: .
    buildCommand: corepack enable && corepack prepare pnpm@9.15.9 --activate && pnpm install --frozen-lockfile && pnpm --filter @vendefacil/mobile web:export
    staticPublishPath: apps/mobile/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://vende-facil-api.onrender.com
      - key: EXPO_PUBLIC_EAS_PROJECT_ID
        value: c1e70ad7-c5fe-4c1e-8a4b-3b8269553f5e

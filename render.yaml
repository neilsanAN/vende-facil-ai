# VendeFácil AI — banco e app web.
# URL pública: https://vende-facil-ai.onrender.com

databases:
  - name: vende-facil-db
    plan: free
    databaseName: vendefacil
    user: vendefacil

services:
  - type: web
    name: vende-facil-ai
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://vende-facil-ai.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: vende-facil-db
          property: connectionString
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: STORAGE_DRIVER
        value: local
      - key: TRUST_PROXY
        value: "true"
      - key: GEMINI_TEXT_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_VISION_MODEL
        value: gemini-2.0-flash
      # Defina GEMINI_API_KEY no painel do Render (Environment).

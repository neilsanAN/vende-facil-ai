# VendeFácil AI — Blueprint no estilo Invento (API Node + App Expo Web + Postgres)
#
# Serviços:
#   API (vende-facil-api / Node): https://vende-facil-ai.onrender.com
#   App (vende-facil-app / static): https://vende-facil-app.onrender.com
#
# Secrets (GEMINI_API_KEY etc.) só no serviço API.

databases:
  - name: vende-facil-db
    plan: free
    databaseName: vendefacil
    user: vendefacil

services:
  - type: web
    name: vende-facil-api
    runtime: node
    plan: free
    region: oregon
    # --prod=false: NODE_ENV=production no Render pula devDeps; precisamos do toolchain de build.
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm build:render
    startCommand: pnpm start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20.19.0"
      - key: APP_URL
        value: https://vende-facil-ai.onrender.com
      - key: CORS_ORIGINS
        value: "https://vende-facil-app.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: vende-facil-db
          property: connectionString
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: STORAGE_DRIVER
        value: r2
      - key: R2_BUCKET_PRIVATE
        value: vendefacil-private
      - key: R2_BUCKET_PUBLIC
        value: vendefacil-public
      # Secrets — preencher no dashboard do Render (Environment):
      # R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
      # R2_ENDPOINT (opcional se R2_ACCOUNT_ID existir)
      # R2_PUBLIC_BASE_URL (URL pública do bucket public, ex. https://pub-xxx.r2.dev)
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: TRUST_PROXY
        value: "true"
      - key: GEMINI_TEXT_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_VISION_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false

  - type: web
    name: vende-facil-app
    runtime: static
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @vendefacil/mobile web:export
    staticPublishPath: apps/mobile/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://vende-facil-ai.onrender.com
      - key: EXPO_PUBLIC_EAS_PROJECT_ID
        value: c1e70ad7-c5fe-4c1e-8a4b-3b8269553f5e
      - key: NODE_VERSION
        value: "20.19.0"
